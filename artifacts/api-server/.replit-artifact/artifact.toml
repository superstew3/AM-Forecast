kind = "api"
previewPath = "/"
title = "AM Forecast"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/", "/api"]

[services.development]
run = "sh -c 'cd /home/runner/workspace/am_forecast && exec python -m uvicorn app.api.main:app --host 0.0.0.0 --port ${PORT:-8080}'"

[services.production]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/am_forecast && exec python -m uvicorn app.api.main:app --host 0.0.0.0 --port ${PORT:-8080}"]

[services.production.health.startup]
path = "/api/health"
